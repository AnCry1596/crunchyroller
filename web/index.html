<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crunchyroller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <div class="brand">
      <img src="/logo.svg" alt="logo" class="brand-icon">
      <span class="brand-title">crunchy<b>roller</b></span>
    </div>
    <div class="badge" id="badge">
      <div class="dot"></div>
      <span id="badge-txt">offline</span>
    </div>
  </header>

  <main>

    <div class="shell">

      <div class="card">
        <div class="card-label">session</div>
        <div class="field">
          <label>session token</label>
          <div class="row">
            <input type="password" id="tok" placeholder="etp_rt cookie value">
            <button class="btn-s" onclick="saveToken()">save</button>
          </div>
        </div>
        <div class="grid2" style="margin-top:12px">
          <button onclick="detect()">auto-detect</button>
          <button onclick="webviewLogin()">browser login</button>
        </div>
        <p class="hint">
          log into <strong>crunchyroll.com</strong> first, then click auto-detect. or use browser login to sign in here.
        </p>
      </div>

      <div class="card">
        <div class="card-label">quality</div>
        <div class="grid2">
          <div class="field">
            <label>video</label>
            <select id="vq" onchange="saveCfg()">
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
              <option value="240p">240p</option>
            </select>
          </div>
          <div class="field">
            <label>audio</label>
            <select id="aq" onchange="saveCfg()">
              <option value="192k">192k</option>
              <option value="96k">96k</option>
            </select>
          </div>
          <div class="field">
            <label>audio language</label>
            <select id="al" onchange="saveCfg()">
              <option value="ja-JP">Japanese</option>
              <option value="en-US">English</option>
              <option value="de-DE">German</option>
              <option value="fr-FR">French</option>
              <option value="es-419">Spanish</option>
              <option value="pt-BR">Portuguese</option>
              <option value="ko-KR">Korean</option>
            </select>
          </div>
          <div class="field">
            <label>subtitles</label>
            <select id="sl" onchange="saveCfg()">
              <option value="en-US">English</option>
              <option value="de-DE">German</option>
              <option value="fr-FR">French</option>
              <option value="es-419">Spanish</option>
              <option value="pt-BR">Portuguese</option>
              <option value="ru-RU">Russian</option>
              <option value="ar-SA">Arabic</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">download</div>
        <div class="row">
          <input type="text" id="url" placeholder="paste a crunchyroll url">
          <button id="fetch-btn" onclick="fetchUrl()">fetch</button>
        </div>

        <div id="tree">
          <hr class="div">
          <div class="ser-title" id="ser-title"></div>
          <div id="sn-list"></div>
          <hr class="div">
          <div class="row" style="justify-content:flex-end">
            <button class="btn-s" onclick="pickAll(true)">all</button>
            <button class="btn-s" onclick="pickAll(false)">none</button>
            <button onclick="startDl()">download</button>
          </div>
        </div>
      </div>

      <div class="card" id="dl-panel">
        <div class="card-label">progress</div>
        <div class="dl-status-row">
          <span id="pill" class="pill pill-run"><span class="spin"></span>downloading</span>
          <span id="dl-ep-counter" class="dl-counter">0 / 0</span>
          <span id="dl-speed" class="dl-speed"></span>
        </div>
        <div id="cur-ep" class="dl-ep-name"></div>
        <div class="dl-bar-label">
          <span class="dl-bar-title">overall</span>
          <span id="ppct-overall" class="dl-bar-pct">0.0%</span>
        </div>
        <div class="prog-bar-wrap">
          <div class="prog-bar" id="pbar-overall"></div>
        </div>
        <div class="dl-bar-label">
          <span class="dl-bar-title">track</span>
          <span id="dl-segs" class="dl-bar-pct"></span>
        </div>
        <div class="prog-bar-wrap prog-bar-wrap-sm">
          <div class="prog-bar prog-bar-dim" id="pbar-track"></div>
        </div>
        <div id="log"></div>
      </div>

    </div>

  </main>

  <div id="toast"></div>
  <script src="/js/particles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
